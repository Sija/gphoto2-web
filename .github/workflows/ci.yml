name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crystal: [latest, nightly]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Update APT package index
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq

      - name: Install APT packages
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install libevent-dev libyaml-dev libgphoto2-6 libgphoto2-dev libgphoto2-port12 libvips-dev libexif-dev

      - name: Install homebrew packages
        if: matrix.os == 'macos-latest'
        run: brew install libgphoto2 vips libexif

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      # Make `.pc` files of keg-only homebrew dependencies visible to `pkg-config`,
      # otherwise it fails to resolve `vips` and the linker gets a bare `-lvips`
      - name: Set up PKG_CONFIG_PATH
        if: matrix.os == 'macos-latest'
        run: |
          for dir in "$(brew --prefix)"/opt/*/lib/pkgconfig; do
            if [ -d "$dir" ]; then
              PKG_CONFIG_PATH="${PKG_CONFIG_PATH:+$PKG_CONFIG_PATH:}$dir"
            fi
          done
          export PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          pkg-config --print-errors --libs vips

      - name: Download source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: shards install

      - name: Run specs
        run: crystal spec

      - name: Build server
        run: shards build
